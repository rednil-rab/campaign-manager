name: Bug report
description: Report a reproducible problem with Questkeeper.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Before submitting, check whether this issue has already been reported.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
      placeholder: A clear description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the steps needed to reproduce the problem.
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and environment
      description: Include your browser and any relevant environment details.
    validations:
      required: false
